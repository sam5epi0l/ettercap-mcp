[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ettercap-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Ettercap command-line workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ettercap MCP contributors" }]
keywords = ["mcp", "ettercap", "security", "network"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.scripts]
ettercap-mcp = "ettercap_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
